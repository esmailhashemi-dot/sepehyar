<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشتریان - سپه‌یار</title>

<meta name="theme-color" content="#12355b">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="app-header">

<div class="header-title">

<h1>👥 مشتریان</h1>

<p>
ثبت و مدیریت اطلاعات مشتریان
</p>

</div>


</header>




<main class="container">



<section class="form-card">


<h2>
ثبت مشتری جدید
</h2>



<label>
نام و نام خانوادگی
</label>


<input

id="customerName"

type="text"

placeholder="نام مشتری"

>




<label>
شماره تماس
</label>


<input

id="customerPhone"

type="tel"

inputmode="numeric"

placeholder="شماره موبایل"

>




<label>
معدل حساب (ریال)
</label>


<input

id="customerAverage"

type="text"

inputmode="numeric"

placeholder="مثال: 500,000,000"

>




<button onclick="addCustomer()">

➕ ثبت مشتری

</button>



</section>







<section class="info-card">


<h2>
جستجوی مشتری
</h2>



<input

id="searchCustomer"

type="text"

placeholder="نام مشتری را وارد کنید..."

onkeyup="searchCustomers()"

>



</section>







<section class="customer-section">


<h2>
لیست مشتریان
</h2>


<div id="customerList">


<p class="empty">

هنوز مشتری ثبت نشده است

</p>


</div>


</section>





</main>
