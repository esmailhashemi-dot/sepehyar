<section class="card">


<h2>
ثبت مشتری جدید
</h2>

id="customerName"

id="customerPhone"

<input 
id="customerAverage"
type="number"

<button onclick="addCustomer()">

id="searchCustomer"
placeholder="جستجوی مشتری..."
onkeyup="searchCustomers()">
