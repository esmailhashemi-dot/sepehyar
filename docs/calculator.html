<body>


<header class="header">

<div>

<h1>🧮 محاسبه تسهیلات</h1>

<p>
محاسبه هوشمند وام
</p>

</div>


</header>



<main>


<section class="card calculator">


<h2>
اطلاعات حساب
</h2>



<label>
معدل حساب (ریال)
</label>

<input 
type="number"
id="average"
placeholder="مثال: 500000000">



<label>
ضریب تسهیلات
</label>

<input 
type="number"
id="factor"
value="3"
step="0.1">



<label>
مدت بازپرداخت (ماه)
</label>


<input 
type="number"
id="months"
value="36">



<label>
نرخ کارمزد (%)
</label>


<input 
type="number"
id="fee"
value="4"
step="0.1">



<button onclick="calculateLoan()">

محاسبه

</button>



<div id="loanResult" class="result-box">

نتیجه محاسبه اینجا نمایش داده می‌شود

</div>


</section>





<section class="card">


<h3>
توضیحات
</h3>


<p>

مبلغ تسهیلات بر اساس معدل حساب، ضریب انتخابی و مدت بازپرداخت محاسبه می‌شود.

</p>


<p>

تمام مبالغ به ریال نمایش داده می‌شوند.

</p>


</section>



</main>
