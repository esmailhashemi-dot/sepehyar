<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>محاسبه تسهیلات - سپه‌یار</title>

<meta name="theme-color" content="#12355b">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="app-header">

<div class="header-title">

<h1>🧮 محاسبه تسهیلات</h1>

<p>
محاسبه سریع و هوشمند وام
</p>

</div>


</header>




<main class="container">



<section class="form-card">


<h2>
اطلاعات تسهیلات
</h2>



<label>
معدل حساب (ریال)
</label>


<input

id="average"

type="text"

inputmode="numeric"

placeholder="مثال: 500,000,000"

>



<label>
ضریب تسهیلات
</label>


<input

id="factor"

type="number"

step="0.1"

value="3"

>



<label>
مدت بازپرداخت (ماه)
</label>


<input

id="months"

type="number"

value="36"

>



<label>
نرخ کارمزد (%)
</label>


<input

id="fee"

type="number"

step="0.1"

value="4"

>




<button onclick="calculateLoan()">

🧮 محاسبه کن

</button>




<div id="loanResult" class="result-box">

نتیجه محاسبه اینجا نمایش داده می‌شود

</div>



</section>





<section class="info-card">


<h3>
راهنما
</h3>


<p>

مبلغ معدل حساب را وارد کنید. عدد هنگام تایپ به‌صورت خودکار با جداکننده هزارگان نمایش داده می‌شود.

</p>


<p>

نتیجه شامل مبلغ تسهیلات، کارمزد، مبلغ کل بازپرداخت و قسط ماهانه خواهد بود.

</p>


</section>




</main>
